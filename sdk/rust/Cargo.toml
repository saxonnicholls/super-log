[package]
name = "super-log"
version = "0.1.0"
edition = "2021"
description = "Forward log and tracing events to a super-log hub"
authors = ["Saxon Herschel Nicholls"]
publish = false
license = "MIT"

# The core is dependency-free on purpose: std::net::TcpStream is one connect()
# from the hub, and hand-rolled JSON escaping is the same trade the C++ SDK
# makes. Only the tracing bridge pulls crates, and only when asked for.
[dependencies]
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }

# Exactly one of `development` / `production` must be enabled - lib.rs
# refuses to compile with neither or both, the same rule as the C++ SDK's
# SUPERLOG_DEVELOPMENT/SUPERLOG_PRODUCTION. No default on purpose: deciding
# is the point. In production the crate is an inert shell - no worker, no
# serialisation, nothing on the wire.
[features]
default = []
development = []
production = []
tracing-layer = ["dep:tracing", "dep:tracing-subscriber"]
